.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:10px}

.it.nopic{grid-template-columns:44px minmax(0,1fr)}

.thumb img{width:100%;height:100%;object-fit:cover;display:block}

.thumb.ico .cam{position:absolute;right:6px;bottom:6px;font-size:12px;letter-spacing:0;background:#fff;border-radius:999px;padding:2px 5px;box-shadow:0 1px 0 var(--line)}

.thumb.busy::after{content:'上傳中…';position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;font-size:12px;font-weight:700}

.it .tt{font:900 14.5px var(--f-num);font-variant-numeric:tabular-nums}
.it .tt span{font:700 12px var(--f-body);background:var(--bg);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.it .nm{font-family:var(--f-cute);font-size:17px;line-height:1.35;margin-top:1px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:#7a665c;margin-top:4px}
.it .note{font-size:13px;margin-top:4px}
.warn{list-style:none;margin:6px 0 0;padding:7px 10px;background:var(--warn-soft);border-radius:12px;font-size:12.5px}
.warn li{padding-left:18px;position:relative}
.warn li::before{content:"!";position:absolute;left:0;top:2px;width:13px;height:13px;border-radius:50%;background:var(--warn);color:#fff;font:900 9px/13px var(--f-num);text-align:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.lk{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue);text-decoration:none}
.lk.ph{background:var(--lilac-soft);color:#7a5bd1}
.lk.yp{background:#FFE3E3;color:#C8302F}
.lk.buy{background:var(--orange-soft);color:var(--warn)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;margin-left:4px;vertical-align:2px;line-height:18px}
.chip.unv{background:#F4EADC;color:#9A6A2E}.chip.book{background:var(--pink-soft);color:#D2496A}.chip.new{background:var(--mint-soft);color:#2F8A57}
.tools{display:none;gap:6px;margin-top:6px}
body.editing .tools{display:flex}
.tools button{border:0;border-radius:10px;padding:4px 10px;font-size:12.5px;background:var(--bg);color:var(--ink)}
.tools .del.armed{background:var(--warn);color:#fff}

.sortable-ghost{opacity:.4}
.notes{margin:12px 0 0;padding:10px 14px;background:var(--yellow-soft);border-radius:16px;font-size:13.5px}

.sec{padding-top:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}

.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;background:var(--bg);color:var(--ink)}

  function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true;}catch(e){setTimeout(()=>window.toast&&toast('手機空間不足，照片可能存不下'),0);return false;}}
  function notify(){subs.forEach(f=>f());}
  const snap=p=>({id:p.split('/').pop(),exists:p in store,data:()=>store[p],metadata:{fromCache:false,hasPendingWrites:false}});
  const db={
    doc(p){return{
      onSnapshot(cb){const f=()=>cb(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f);},
      get(){return Promise.resolve(snap(p));},
      update(d){store[p]=Object.assign({},store[p]||{},JSON.parse(JSON.stringify(d)));save();setTimeout(notify,0);return Promise.resolve();},
      set(d){store[p]=JSON.parse(JSON.stringify(d));save();setTimeout(notify,0);return Promise.resolve();}};},

  };

  document.body.classList.toggle('book',U.book);
  const views={plan:vPlan,flight:vFlight,shop:vShop,pack:vPack,money:vMoney,tips:vTips};
  document.getElementById('app').innerHTML=U.book?Object.values(views).map(f=>f()).join(''):views[U.tab]();
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===U.tab));
  document.getElementById('modeBtn').setAttribute('aria-pressed',U.book);
  sortables.forEach(s=>s.destroy());sortables=[];
  if(U.edit&&!U.book&&window.Sortable) document.querySelectorAll('.tl').forEach(el=>{
    sortables.push(Sortable.create(el,{handle:'.handle',animation:160,ghostClass:'sortable-ghost',onEnd:()=>{
      const n=+el.dataset.n,d=dayDoc(n);const ids=[...el.children].map(li=>li.dataset.id);
      const items=ids.map(id=>d.items.find(i=>i.id===id)).filter(Boolean);d.items=items;write('days/d'+n,{items});toast('順序已儲存');}}));});
  window.scrollTo(0,y);
}

const sheet=document.getElementById('sheet'),sheetIn=document.getElementById('sheetIn');
function openForm(title,fields,vals,onSave){
  sheetIn.innerHTML=`<h3>${title}</h3><form class="form" id="fm">${fields.map(f=>{
    const v=esc(vals[f.k]??'');const id='f-'+f.k;
    const input=f.type==='select'?`<select id="${id}" name="${f.k}">${f.opts.map(o=>`<option ${o===vals[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`
     :f.type==='area'?`<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}">${v}</textarea>`
     :`<input id="${id}" name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="0.01" inputmode="decimal"':''} value="${v}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`;
    return `<label for="${id}">${f.lb}${input}</label>`;}).join('')}
    <div class="acts"><button type="button" class="btn" data-act="close">取消</button><button type="submit" class="btn pri">儲存</button></div></form>`;
  sheet.hidden=false;
  document.getElementById('fm').onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=String(v).trim());sheet.hidden=true;onSave(o);};
  setTimeout(()=>{const f=sheetIn.querySelector('input,select');f&&f.focus();},50);
}
const ITEM_F=[{k:'t',lb:'時間',ph:'例如 14:00–15:30',req:1},{k:'kind',lb:'類型',type:'select',opts:KINDS},{k:'nm',lb:'名稱',req:1},{k:'en',lb:'英文／荷文名稱（找照片用）'},{k:'icon',lb:'代表圖示（貼 1–2 個表情符號）',ph:'例如 🌷'},{k:'q',lb:'Google 地圖搜尋字',ph:'例如 Rijksmuseum Amsterdam'},{k:'stay',lb:'建議停留',ph:'例如 1.5 小時'},{k:'move',lb:'交通方式與費用',ph:'例如 電車 15 分・€3.40／人'},{k:'cost',lb:'費用',ph:'例如 €25／人'},{k:'note',lb:'備註',type:'area'},{k:'warn',lb:'注意事項（一行一條）',type:'area'},{k:'url',lb:'訂票網址',type:'url'}];
function itemFromForm(o,base){return Object.assign({},base,{t:o.t,kind:o.kind,nm:o.nm,en:o.en,icon:o.icon,q:o.q,stay:o.stay,move:o.move,cost:o.cost,note:o.note,url:o.url,warn:o.warn?o.warn.split('\n').map(s=>s.trim()).filter(Boolean):[]});}
const FLIGHT_F=[{k:'who',lb:'誰的航班',ph:'我們／夥伴'},{k:'airline',lb:'航空公司'},{k:'no',lb:'航班號碼',ph:'CI073'},{k:'from',lb:'出發',ph:'TPE 桃園'},{k:'to',lb:'抵達',ph:'AMS 史基浦'},{k:'dep',lb:'起飛時間',ph:'2027/02/04 23:15'},{k:'arr',lb:'抵達時間',ph:'2027/02/05 07:50'},{k:'pnr',lb:'訂位代號'},{k:'seat',lb:'座位'},{k:'note',lb:'備註',type:'area'}];

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(U.armed&&!e.target.closest('.sheet')){U.armed=null;render();}return;}
  const a=b.dataset.act, n=+b.dataset.n, id=b.dataset.id;
  if(!a.startsWith('del-'))U.armed=null;
  if(a==='day'){U.day=n;ls.set('nl3-day',n);render();window.scrollTo(0,0);}
  else if(a==='edit'){U.edit=!U.edit;render();}
  else if(a==='close'){sheet.hidden=true;}
  else if(a==='add-item'){openForm('＋ 新增行程',ITEM_F,{kind:'參觀'},o=>{const d=dayDoc(n);d.items=[...(d.items||[]),itemFromForm(o,{id:'i'+uid(),tags:[]})];render();write('days/d'+n,{items:d.items});toast('已新增，可拖曳 ⠿ 調整順序');});}
  else if(a==='edit-item'){const d=dayDoc(n),it=d.items.find(i=>i.id===id);openForm('✏️ 修改行程',ITEM_F,Object.assign({},it,{warn:(it.warn||[]).join('\n')}),o=>{d.items=d.items.map(i=>i.id===id?itemFromForm(o,i):i);render();write('days/d'+n,{items:d.items});toast('已儲存');});}
  else if(a==='del-item'){if(U.armed!==id){U.armed=id;render();return;}const d=dayDoc(n);d.items=d.items.filter(i=>i.id!==id);U.armed=null;render();write('days/d'+n,{items:d.items});toast('已刪除');}
  else if(a==='add-flight'){openForm('✈️ 新增航班',FLIGHT_F,{},o=>{S.flights=[...S.flights,Object.assign({id:'f'+uid()},o)];render();write('trip/flights',{list:S.flights});});}
  else if(a==='edit-flight'){const f=S.flights.find(x=>x.id===id);openForm('✏️ 修改航班',FLIGHT_F,f,o=>{S.flights=S.flights.map(x=>x.id===id?Object.assign({},x,o):x);render();write('trip/flights',{list:S.flights});toast('已儲存');});}
  else if(a==='del-flight'){if(U.armed!==id){U.armed=id;render();return;}S.flights=S.flights.filter(x=>x.id!==id);U.armed=null;render();write('trip/flights',{list:S.flights});}
  else if(a==='add-shop'){openForm('🛍️ 新增必買',[{k:'stop',lb:'哪一站',ph:'例如 風車村（Day 3）',req:1},{k:'item',lb:'要買什麼',req:1},{k:'note',lb:'備註'}],{},o=>{S.shop=[...S.shop,Object.assign({id:'s'+uid(),done:false},o)];render();write('trip/shop',{list:S.shop});});}
  else if(a==='add-pack'){openForm('🧳 新增行李',[{k:'cat',lb:'分類',type:'select',opts:[...new Set([...S.pack.map(x=>x.cat),'其他'])]},{k:'item',lb:'物品',req:1}],{cat:'其他'},o=>{S.pack=[...S.pack,{id:'p'+uid(),cat:o.cat,item:o.item,done:false}];render();write('trip/pack',{list:S.pack});});}
  else if(a==='del-pack'){if(U.armed!==id){U.armed=id;render();return;}S.pack=S.pack.filter(x=>x.id!==id);U.armed=null;render();write('trip/pack',{list:S.pack});}
  else if(a==='del-shop'){if(U.armed!==id){U.armed=id;render();return;}S.shop=S.shop.filter(x=>x.id!==id);U.armed=null;render();write('trip/shop',{list:S.shop});}
  else if(a==='add-exp'){const today=new Date();const md=String(today.getMonth()+1).padStart(2,'0')+'/'+String(today.getDate()).padStart(2,'0');
    openForm('💶 記一筆',[{k:'desc',lb:'項目',req:1,ph:'例如 海尼根門票'},{k:'amount',lb:'金額',type:'number',req:1},{k:'cur',lb:'幣別',type:'select',opts:['EUR','TWD']},{k:'cat',lb:'分類',type:'select',opts:Object.keys(CATS)},{k:'date',lb:'日期',type:'select',opts:[...TRIP_DATES,'出發前']},{k:'who',lb:'誰付的',type:'select',opts:['雅涵','老公','一起']}],
      {cur:'EUR',cat:'餐飲',date:TRIP_DATES.includes(md)?md:'出發前',who:'一起'},o=>{const amt=parseFloat(o.amount);if(!(amt>0)){toast('金額要大於 0');return;}
      S.money.list=[...(S.money.list||[]),{id:'e'+uid(),ts:Date.now(),desc:o.desc,amount:amt,cur:o.cur,cat:o.cat,date:o.date,who:o.who}];render();write('trip/money',{list:S.money.list});toast('記好了');});}
  else if(a==='del-exp'){if(U.armed!==id){U.armed=id;render();return;}S.money.list=S.money.list.filter(x=>x.id!==id);U.armed=null;render();write('trip/money',{list:S.money.list});}
  else if(a==='pic'){if(!ASSETS||!CAN){toast('需要編輯權限才能放照片');return;}picTarget={n,id};picker.value='';picker.click();}
  else if(a==='rm-pic'){const d=dayDoc(n),it=d.items.find(i=>i.id===id);const old=it.imgId;d.items=d.items.map(i=>i.id===id?Object.assign({},i,{img:'',imgId:''}):i);render();write('days/d'+n,{items:d.items}).then(()=>{if(old&&ASSETS)ASSETS.delete(old).catch(()=>{});});toast('已移除照片');}
  else if(a==='swap'){const r=+S.money.rate||36.69;U.conv.eur=U.conv.dir==='e2t'?Math.round(U.conv.eur*r):+(U.conv.eur/r).toFixed(2);U.conv.dir=U.conv.dir==='e2t'?'t2e':'e2t';render();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act2==='pack-done'){S.pack=S.pack.map(x=>x.id===t.dataset.id?Object.assign({},x,{done:t.checked}):x);render();write('trip/pack',{list:S.pack});}
  if(t.dataset.act2==='shop-done'){S.shop=S.shop.map(x=>x.id===t.dataset.id?Object.assign({},x,{done:t.checked}):x);render();write('trip/shop',{list:S.shop});}
  if(t.id==='rate'){const v=parseFloat(t.value);if(v>0){S.money.rate=v;S.money.rateDate='手動更新 '+new Date().toLocaleDateString('zh-TW');render();write('trip/money',{rate:v,rateDate:S.money.rateDate});}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='cv-in'){U.conv.eur=parseFloat(e.target.value)||0;const r=+S.money.rate||36.69;document.getElementById('cv-out').value=U.conv.dir==='e2t'?fmtT(U.conv.eur*r):fmtE(U.conv.eur/r);}
});
picker.addEventListener('change',async()=>{
  const f=picker.files&&picker.files[0];if(!f||!picTarget)return;const {n,id}=picTarget;
  const el=document.querySelector(`.thumb[data-id="${id}"]`);el&&el.classList.add('busy');
  try{
    const bmp=await createImageBitmap(f);const sc=Math.min(1,900/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
    const up=await ASSETS.upload(blob);
    const d=dayDoc(n);const old=(d.items.find(i=>i.id===id)||{}).imgId;
    d.items=d.items.map(i=>i.id===id?Object.assign({},i,{img:up.url,imgId:up.id}):i);render();
    await write('days/d'+n,{items:d.items});if(old)ASSETS.delete(old).catch(()=>{});toast('照片放好了 📷');
  }catch(e){el&&el.classList.remove('busy');toast('上傳失敗，換一張照片試試');}
});
sheet.addEventListener('click',e=>{if(e.target===sheet)sheet.hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')sheet.hidden=true;});
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{U.tab=b.dataset.tab;U.edit=false;ls.set('nl3-tab',U.tab);render();window.scrollTo(0,0);}));
document.getElementById('modeBtn').addEventListener('click',()=>{U.book=!U.book;U.edit=false;render();window.scrollTo(0,0);});

render();
(async()=>{
  const db=await window.claude?.use?.('db');
  if(!db){S.days=[];document.getElementById('app').innerHTML=`<div class="empty"><b>🔒</b>請登入 claude.ai 後開啟，才看得到行程資料</div>`;return;}
  DB=db;
  window.claude.use('assets').then(a=>{ASSETS=a;render();}).catch(()=>{});
  try{const user=await window.claude.use('user');const c=user?await user.can('data.write'):null;if(c===false)CAN=false;}catch(e){}
  db.collection('days').orderBy('n').onSnapshot(snap=>{S.days=snap.docs.map(d=>JSON.parse(JSON.stringify(d.data())));
    if(!S.days.find(d=>d.n===U.day)&&S.days.length)U.day=S.days[0].n;render();},()=>toast('行程讀取失敗，請重新整理'));
  db.doc('trip/flights').onSnapshot(s=>{S.flights=s.exists?JSON.parse(JSON.stringify(s.data().list||[])):[];render();});
  db.doc('trip/pack').onSnapshot(s=>{S.pack=s.exists?JSON.parse(JSON.stringify(s.data().list||[])):[];render();});
  db.doc('trip/shop').onSnapshot(s=>{S.shop=s.exists?JSON.parse(JSON.stringify(s.data().list||[])):[];render();});
  db.doc('trip/money').onSnapshot(s=>{if(s.exists){const d=s.data();S.money={rate:d.rate||36.69,rateDate:d.rateDate||'',list:JSON.parse(JSON.stringify(d.list||[]))};}render();});
})();
</script>
<script>
(function(){
  const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;document.body.appendChild(fi);
  let resetArmed=false;
  const msg=t=>{const m=document.getElementById('bkmsg');if(m)m.textContent=t;};
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-bk]');if(!b)return;const k=b.dataset.bk;
    if(k==='export'){const blob=new Blob([TRIP.exportJSON()],{type:'application/json'});const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='荷蘭行程備份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);msg('已匯出，檔案在下載資料夾');}
    else if(k==='import'){fi.value='';fi.click();}
    else if(k==='reset'){if(!resetArmed){resetArmed=true;b.textContent='確定要恢復？你改過的會不見';return;}TRIP.reset();resetArmed=false;msg('已恢復原始行程');}
  });
  fi.addEventListener('change',async()=>{const f=fi.files[0];if(!f)return;try{TRIP.importJSON(await f.text());msg('匯入完成 🎉');}catch(e){msg('這個檔案不是行程備份，換一個試試');}});
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
