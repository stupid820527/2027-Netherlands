:root{

*{box-sizing:border-box}

button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.en{font:700 13px var(--f-num);color:var(--muted);line-height:1.3}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:10px}
.fly{display:inline-flex;align-items:center;gap:5px;background:var(--card);box-shadow:0 2px 0 var(--line);border-radius:999px;padding:1px 9px;font-size:15px;vertical-align:3px;margin-left:4px}

.fly i{font-style:normal;display:inline-block;animation:fly 2.4s ease-in-out infinite}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}

.day{background:var(--card);border-radius:24px;box-shadow:0 3px 0 var(--line);margin:8px 0 18px;overflow:hidden}

.edit-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.pillbtn{border:0;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;background:var(--yellow-soft);color:var(--ink)}
.pillbtn.on{background:var(--ink);color:#fff}
.pillbtn.add{background:var(--mint-soft)}
.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}

.meal .lb{font-size:12px;color:var(--muted)}
.meal b{display:block;font-family:var(--f-cute);font-weight:400;font-size:15px;line-height:1.35}
.meal .ty{font-size:12.5px}
.meal .pp{font:800 12.5px var(--f-num);color:var(--orange)}

.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;border-left:2.5px dotted var(--line)}
.it{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) 96px;gap:10px;padding:9px 0}
.it.nopic{grid-template-columns:44px minmax(0,1fr)}
.thumb{width:96px;height:96px;border-radius:22px;overflow:hidden;align-self:start;margin-top:4px;background:var(--c);position:relative;border:0;padding:0;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.ico{font-size:40px;line-height:1;letter-spacing:-4px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.thumb.ico .cam{position:absolute;right:6px;bottom:6px;font-size:12px;letter-spacing:0;background:#fff;border-radius:999px;padding:2px 5px;box-shadow:0 1px 0 var(--line)}

.thumb.busy::after{content:'上傳中…';position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;font-size:12px;font-weight:700}
@media (max-width:420px){.it{grid-template-columns:40px minmax(0,1fr) 80px}.thumb{width:80px;height:80px;border-radius:18px}.emo{width:40px;height:40px}}
.emo{width:44px;height:44px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:22px;position:relative;z-index:1}
.it .tt{font:900 14.5px var(--f-num);font-variant-numeric:tabular-nums}
.it .tt span{font:700 12px var(--f-body);background:var(--bg);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.it .nm{font-family:var(--f-cute);font-size:17px;line-height:1.35;margin-top:1px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:#7a665c;margin-top:4px}
.it .note{font-size:13px;margin-top:4px}
.warn{list-style:none;margin:6px 0 0;padding:7px 10px;background:var(--warn-soft);border-radius:12px;font-size:12.5px}
.warn li{padding-left:18px;position:relative}
.warn li::before{content:"!";position:absolute;left:0;top:2px;width:13px;height:13px;border-radius:50%;background:var(--warn);color:#fff;font:900 9px/13px var(--f-num);text-align:center}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.lk{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--blue-soft);color:var(--blue);text-decoration:none}
.lk.ph{background:var(--lilac-soft);color:#7a5bd1}
.lk.yp{background:#FFE3E3;color:#C8302F}
.lk.buy{background:var(--orange-soft);color:var(--warn)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;margin-left:4px;vertical-align:2px;line-height:18px}
.chip.unv{background:#F4EADC;color:#9A6A2E}.chip.book{background:var(--pink-soft);color:#D2496A}.chip.new{background:var(--mint-soft);color:#2F8A57}
.tools{display:none;gap:6px;margin-top:6px}
body.editing .tools{display:flex}
.tools button{border:0;border-radius:10px;padding:4px 10px;font-size:12.5px;background:var(--bg);color:var(--ink)}
.tools .del.armed{background:var(--warn);color:#fff}
.handle{display:inline-grid;width:auto;padding:4px 10px;border-radius:10px;background:var(--ink);color:#fff;place-items:center;font-size:12.5px;touch-action:none;cursor:grab}
.sortable-ghost{opacity:.4}
.notes{margin:12px 0 0;padding:10px 14px;background:var(--yellow-soft);border-radius:16px;font-size:13.5px}
.notes ul{margin:4px 0 0;padding-left:18px}
.sec{padding-top:6px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}

.sheet-in{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:88vh;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

function vMoney(){

  </div>
  <div class="totals"><div class="tot"><b>${fmtE(totE)}</b><span>總花費（歐元）</span></div><div class="tot"><b>${fmtT(totE*r)}</b><span>約新台幣・每人 ${fmtT(totE*r/2)}</span></div></div>
  ${list.length?`<div class="card"><h3>📊 分類</h3><div class="bars">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${CATS[k]||'✨'} ${esc(k)}</span><div class="tr"><div class="fl" style="width:${(v/max*100).toFixed(1)}%"></div></div><span class="v">${fmtE(v)}</span></div>`).join('')}</div></div>
  ${list.map(x=>{const armed=U.armed===x.id;const e=toE(x);return `<div class="exp"><div class="ce">${CATS[x.cat]||'✨'}</div><div style="min-width:0"><div>${esc(x.desc)}</div><div class="ds">${esc(x.date)}・${esc(x.cat)}・${esc(x.who||'')}</div></div><div class="am">${x.cur==='TWD'?fmtT(x.amount):fmtE(x.amount)}<small>${x.cur==='TWD'?'≈ '+fmtE(e):'≈ '+fmtT(e*r)}</small></div>${CAN&&!U.book?`<button class="x ${armed?'armed':''}" data-act="del-exp" data-id="${esc(x.id)}" aria-label="刪除">${armed?'刪除？':'✕'}</button>`:'<span></span>'}</div>`}).join('')}`

}

let sortables=[];
function render(){
  const y=window.scrollY;
  document.body.classList.toggle('editing',U.edit&&!U.book);
  document.body.classList.toggle('book',U.book);
  const views={plan:vPlan,flight:vFlight,shop:vShop,pack:vPack,money:vMoney,tips:vTips};
  document.getElementById('app').innerHTML=U.book?Object.values(views).map(f=>f()).join(''):views[U.tab]();
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===U.tab));
  document.getElementById('modeBtn').setAttribute('aria-pressed',U.book);
  sortables.forEach(s=>s.destroy());sortables=[];
  if(U.edit&&!U.book&&window.Sortable) document.querySelectorAll('.tl').forEach(el=>{
    sortables.push(Sortable.create(el,{handle:'.handle',animation:160,ghostClass:'sortable-ghost',onEnd:()=>{
      const n=+el.dataset.n,d=dayDoc(n);const ids=[...el.children].map(li=>li.dataset.id);
      const items=ids.map(id=>d.items.find(i=>i.id===id)).filter(Boolean);d.items=items;write('days/d'+n,{items});toast('順序已儲存');}}));});
  window.scrollTo(0,y);
}

const sheet=document.getElementById('sheet'),sheetIn=document.getElementById('sheetIn');
function openForm(title,fields,vals,onSave){
  sheetIn.innerHTML=`<h3>${title}</h3><form class="form" id="fm">${fields.map(f=>{
    const v=esc(vals[f.k]??'');const id='f-'+f.k;
    const input=f.type==='select'?`<select id="${id}" name="${f.k}">${f.opts.map(o=>`<option ${o===vals[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`
     :f.type==='area'?`<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}">${v}</textarea>`
     :`<input id="${id}" name="${f.k}" type="${f.type||'text'}" ${f.type==='number'?'step="0.01" inputmode="decimal"':''} value="${v}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>`;
    return `<label for="${id}">${f.lb}${input}</label>`;}).join('')}
    <div class="acts"><button type="button" class="btn" data-act="close">取消</button><button type="submit" class="btn pri">儲存</button></div></form>`;
  sheet.hidden=false;
  document.getElementById('fm').onsubmit=e=>{e.preventDefault();const o={};new FormData(e.target).forEach((v,k)=>o[k]=String(v).trim());sheet.hidden=true;onSave(o);};
  setTimeout(()=>{const f=sheetIn.querySelector('input,select');f&&f.focus();},50);
}

picker.addEventListener('change',async()=>{
  const f=picker.files&&picker.files[0];if(!f||!picTarget)return;const {n,id}=picTarget;
  const el=document.querySelector(`.thumb[data-id="${id}"]`);el&&el.classList.add('busy');
  try{
    const bmp=await createImageBitmap(f);const sc=Math.min(1,900/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
    const up=await ASSETS.upload(blob);
    const d=dayDoc(n);const old=(d.items.find(i=>i.id===id)||{}).imgId;
    d.items=d.items.map(i=>i.id===id?Object.assign({},i,{img:up.url,imgId:up.id}):i);render();
    await write('days/d'+n,{items:d.items});if(old)ASSETS.delete(old).catch(()=>{});toast('照片放好了 📷');
  }catch(e){el&&el.classList.remove('busy');toast('上傳失敗，換一張照片試試');}
});

  db.doc('trip/money').onSnapshot(s=>{if(s.exists){const d=s.data();S.money={rate:d.rate||36.69,rateDate:d.rateDate||'',list:JSON.parse(JSON.stringify(d.list||[]))};}render();});
})();
</script>
<script>
(function(){
  const fi=document.createElement('input');fi.type='file';fi.accept='application/json,.json';fi.hidden=true;document.body.appendChild(fi);
  let resetArmed=false;
  const msg=t=>{const m=document.getElementById('bkmsg');if(m)m.textContent=t;};
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-bk]');if(!b)return;const k=b.dataset.bk;
    if(k==='export'){const blob=new Blob([TRIP.exportJSON()],{type:'application/json'});const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='荷蘭行程備份-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);msg('已匯出，檔案在下載資料夾');}
    else if(k==='import'){fi.value='';fi.click();}
    else if(k==='reset'){if(!resetArmed){resetArmed=true;b.textContent='確定要恢復？你改過的會不見';return;}TRIP.reset();resetArmed=false;msg('已恢復原始行程');}
  });
  fi.addEventListener('change',async()=>{const f=fi.files[0];if(!f)return;try{TRIP.importJSON(await f.text());msg('匯入完成 🎉');}catch(e){msg('這個檔案不是行程備份，換一個試試');}});
  if(window.TRIP_HAS_UPDATE){const bn=document.createElement('div');bn.id='updbar';
    bn.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:#4A3A33;color:#fff;border-radius:18px;padding:12px 14px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2)';
    bn.innerHTML='<b>有新版行程 ✨</b><div style="margin:4px 0 8px">套用後每日行程會換成新版（你加的照片、改過的行程會被換掉）；記帳、機票、必買、行李清單都會保留。</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button data-up="yes" style="border:0;border-radius:999px;padding:7px 14px;background:#FF8FA3;color:#fff;font-weight:700">套用新版行程</button><button data-up="no" style="border:0;border-radius:999px;padding:7px 14px;background:#fff;color:#4A3A33;font-weight:700">保留我的版本</button></div>';
    document.body.appendChild(bn);
    bn.addEventListener('click',e=>{const b=e.target.closest('[data-up]');if(!b)return;if(b.dataset.up==='yes')TRIP.applyUpdate();else TRIP.skipUpdate();bn.remove();});}
  if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
